<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Разбор — анализ шахматных партий</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f2f2;--fg:#000;--mid:#4f4f4f;--line:#d0d0d0;--soft:#e8e8e8;--sl:#c4c4c4;--sd:#575757;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0a;--fg:#fff;--mid:#b0b0b0;--line:#2d2d2d;--soft:#161616;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0a0a;--fg:#fff;--mid:#b0b0b0;--line:#2d2d2d;--soft:#161616;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.5 "Geologica",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
[hidden]{display:none!important}
.wrap{max-width:1120px;margin:0 auto;padding:0 clamp(16px,4vw,32px) 48px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0}
.brand{font-weight:700;font-size:22px;letter-spacing:-.03em}
.tools{display:flex;align-items:center;gap:8px;min-width:0}
.eng{font-size:13px;color:var(--mid);border:1px solid var(--line);border-radius:99px;padding:5px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.eng.ok{color:var(--fg);border-color:var(--fg)}
.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--fg);background:transparent;border-radius:99px;padding:10px 20px;font-weight:500;line-height:1.2;transition:transform .15s,background .2s,opacity .2s}
.btn:hover{background:var(--soft)}.btn:active{transform:scale(.96)}.btn:disabled{opacity:.35;pointer-events:none}
.btn.fill{background:var(--fg);color:var(--bg)}.btn.fill:hover{opacity:.85}
.btn.sm{padding:6px 14px;font-size:14px;border-color:var(--line)}.btn.sm:hover{border-color:var(--fg)}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:7px 15px;font-size:14px;transition:background .2s,color .2s,border-color .2s}
.chip:hover{border-color:var(--fg)}.chip[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.muted{color:var(--mid);font-size:14px}.num{font-variant-numeric:tabular-nums}

/* import */
.intro{padding:clamp(18px,5vw,56px) 0 20px;max-width:760px}
h1{margin:0;font-weight:600;font-size:clamp(38px,9vw,76px);line-height:1;letter-spacing:-.05em;animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(.3em)}}
.lead{color:var(--mid);margin:16px 0 22px;max-width:56ch}
textarea{width:100%;background:transparent;border:1px solid var(--line);border-radius:16px;padding:14px;resize:vertical;min-height:170px;line-height:1.45;font-size:14px}
textarea:focus{border-color:var(--fg);outline:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.row label.btn{cursor:pointer}
.err{min-height:1.4em;margin:10px 0 0;font-weight:500}

/* game */
.ghead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;border-top:1px solid var(--fg);padding:14px 0 18px}
.ghead b{font-weight:600;font-size:20px;letter-spacing:-.02em}
.stage{display:grid;gap:24px}
@media(min-width:960px){.stage{grid-template-columns:minmax(0,580px) 1fr;gap:36px;align-items:start}}
.pl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 2px 8px 24px;font-weight:500}
.pl i{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid var(--fg);margin-right:8px;vertical-align:-1px}
.pl i.w{background:#fff}.pl i.b{background:#000;border-color:var(--fg)}
.bwrap{display:grid;grid-template-columns:14px minmax(0,1fr);gap:10px}
.evbar{width:14px;flex:none;border-radius:8px;overflow:hidden;background:#000;border:1px solid var(--fg);display:flex;flex-direction:column-reverse;position:relative}
.evbar.flip{flex-direction:column}
.evbar i{display:block;background:#fff;height:50%;transition:height .6s cubic-bezier(.3,.9,.3,1)}
.board{position:relative;width:100%;aspect-ratio:1/1;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));border-radius:8px;overflow:hidden;border:1px solid var(--fg);user-select:none}
.sq{position:relative;display:grid;place-items:center;min-width:0;min-height:0}
.sq.l{background:var(--sl)}.sq.d{background:var(--sd)}
.sq.lm::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.3)}
.sq.l.lm::after{background:rgba(0,0,0,.22)}.sq.d.lm::after{background:rgba(255,255,255,.28)}
.co{position:absolute;font-size:calc(var(--u,3px)*2.4);font-weight:600;opacity:.75;pointer-events:none;line-height:1}
.co.r{top:3%;left:5%}.co.f{bottom:3%;right:6%}
.sq.l .co{color:var(--sd)}.sq.d .co{color:var(--sl)}
.pc{position:relative;z-index:2;line-height:1;font-size:calc(var(--u,3px)*9.6);animation:none}
.pc.pop{animation:pop .28s cubic-bezier(.3,1.4,.4,1)}
@keyframes pop{from{transform:scale(.7)}}
.pc::before{content:attr(data-g)}
[data-ps=sil] .pc{font-family:"Segoe UI Symbol","Noto Sans Symbols 2","Apple Symbols","DejaVu Sans",serif}
[data-ps=sil] .pc.w{color:#fff;text-shadow:-1px 0 #000,1px 0 #000,0 -1px #000,0 1px #000}
[data-ps=sil] .pc.b{color:#000;text-shadow:-.6px 0 #fffa,.6px 0 #fffa,0 -.6px #fffa,0 .6px #fffa}
[data-ps=disk] .pc,[data-ps=abc] .pc,[data-ps=tile] .pc{width:78%;height:78%;display:grid;place-items:center;font-size:calc(var(--u,3px)*6.6);font-weight:700}
[data-ps=disk] .pc{font-family:"Segoe UI Symbol","Noto Sans Symbols 2","Apple Symbols","DejaVu Sans",serif;font-weight:400;font-size:calc(var(--u,3px)*7.4)}
[data-ps=abc] .pc::before,[data-ps=tile] .pc::before{content:attr(data-l)}
[data-ps=disk] .pc,[data-ps=abc] .pc{border-radius:50%}[data-ps=tile] .pc{border-radius:24%}
[data-ps=disk] .pc.w,[data-ps=abc] .pc.w,[data-ps=tile] .pc.w{background:#fff;color:#000;border:2px solid #000;box-shadow:0 1px 0 rgba(0,0,0,.4)}
[data-ps=disk] .pc.b,[data-ps=abc] .pc.b,[data-ps=tile] .pc.b{background:#000;color:#fff;border:2px solid #fff;box-shadow:0 1px 0 rgba(0,0,0,.4)}
.arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
.bdg{position:absolute;z-index:5;top:-5%;right:-5%;min-width:calc(var(--u,3px)*4.6);height:calc(var(--u,3px)*4.6);padding:0 calc(var(--u,3px)*.6);border-radius:99px;display:grid;place-items:center;font-size:calc(var(--u,3px)*2.6);font-weight:700;line-height:1;font-style:normal;background:var(--fg);color:var(--bg);border:calc(var(--u,3px)*.4) solid var(--bg);animation:pop .35s cubic-bezier(.3,1.4,.4,1)}
.bdg.bad{background:var(--bg);color:var(--fg);border:calc(var(--u,3px)*.5) solid var(--fg)}
.bdg.big{border-width:calc(var(--u,3px)*.75)}
[data-bs=lvl] .bdg{font-size:0;width:calc(var(--u,3px)*4.6);padding:0;background:conic-gradient(var(--fg) calc(var(--p)*1%),var(--bg) 0);border:calc(var(--u,3px)*.45) solid var(--fg)}
[data-bs=lvl] .bdg[data-c=brilliant]{outline:calc(var(--u,3px)*.4) solid var(--fg);outline-offset:calc(var(--u,3px)*.35)}
[data-bs=lvl] .bdg[data-c=forced]{background:var(--soft)}
.ctl{display:grid;grid-template-columns:repeat(4,1fr) 1.5fr;gap:8px;margin:14px 0 6px 24px}
.ctl .btn{padding:11px 0;font-size:18px}
.ctl .btn.play{font-size:15px}
.hint{margin:0 0 0 24px;font-size:13px;color:var(--mid)}
.prog{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.bar{flex:1;height:10px;border-radius:99px;background:var(--soft);border:1px solid var(--line);overflow:hidden}
.bar u{display:block;height:100%;width:0;background:var(--fg);transition:width .3s}
.say{border-top:1px solid var(--fg);padding:14px 0 18px;min-height:112px}
.say p{margin:0 0 6px}.say .big{font-size:22px;font-weight:600;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.say .bdg{position:static;display:inline-grid;width:auto;animation:none;font-size:13px;height:24px;min-width:24px;padding:0 6px}
[data-bs=lvl] .say .bdg{width:22px;height:22px;font-size:0;padding:0}
[data-bs=lvl] .sum li .bdg,[data-bs=lvl] .mc .bdg{font-size:0;padding:0}
#graph{display:block;width:100%;height:96px;border:1px solid var(--line);border-radius:12px;background:var(--soft);cursor:pointer;touch-action:none}
h2{margin:26px 0 10px;font-weight:600;font-size:22px;letter-spacing:-.03em}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.sum h3{margin:0;font-weight:500;font-size:15px;color:var(--mid)}
.acc{font-size:clamp(34px,7vw,48px);font-weight:600;letter-spacing:-.05em;line-height:1.1;margin:2px 0 6px}
.sum li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}
.sum ul{list-style:none;margin:0;padding:0}
.sum li .bdg{position:static;animation:none;font-size:11px;height:20px;min-width:20px;padding:0 5px;margin-right:8px;display:inline-grid;vertical-align:middle}
[data-bs=lvl] .sum li .bdg{width:18px;height:18px}
.moves{max-height:340px;overflow:auto;border-top:1px solid var(--fg)}
.mr{display:grid;grid-template-columns:34px 1fr 1fr;border-bottom:1px solid var(--line)}
.mn{padding:9px 0 9px 4px;color:var(--mid);font-size:14px}
.mc{display:flex;align-items:center;gap:6px;text-align:left;background:transparent;border:0;border-radius:10px;padding:8px 8px;margin:2px 0;font-size:15px;transition:background .15s}
.mc:hover{background:var(--soft)}
.mc.on{background:var(--fg);color:var(--bg)}
.mc small{color:inherit;opacity:.6;font-size:12px;margin-left:auto}
.mc .bdg{position:static;animation:none;font-size:12px;height:22px;min-width:22px;padding:0 5px;border-width:2px}
[data-bs=lvl] .mc .bdg{width:20px;height:20px;border-width:2px}
.mc.on .bdg{border-color:var(--fg)}

[data-bs=col] .bdg{color:#fff;border-color:var(--bg)}
[data-bs=col] .bdg[data-c=brilliant]{background:#17b1a8}
[data-bs=col] .bdg[data-c=great]{background:#4f86d4}
[data-bs=col] .bdg[data-c=best]{background:#74ad2f}
[data-bs=col] .bdg[data-c=excellent]{background:#74ad2f}
[data-bs=col] .bdg[data-c=good]{background:#86a070}
[data-bs=col] .bdg[data-c=inaccuracy]{background:#e7b923;color:#1a1a1a}
[data-bs=col] .bdg[data-c=mistake]{background:#e8832a}
[data-bs=col] .bdg[data-c=blunder]{background:#d23a35}
[data-bs=col] .bdg[data-c=forced]{background:#8a8a8a}
[data-bs=col] .mc.on .bdg{border-color:var(--bg)}
/* sheet */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{width:min(560px,100%);max-height:88vh;overflow:auto;background:var(--bg);border:1px solid var(--fg);border-radius:22px 22px 0 0;padding:20px 20px calc(env(safe-area-inset-bottom,0px) + 22px);animation:up .35s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{margin:20px 0 10px;font-weight:600;font-size:16px}
.sheet-top{display:flex;justify-content:space-between;align-items:center}
.sheet-top b{font-size:22px;letter-spacing:-.03em}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:12px;border-radius:99px;background:linear-gradient(90deg,#000,#fff);border:1px solid var(--fg)}
input[type=range]::-moz-range-track{height:12px;border-radius:99px;background:linear-gradient(90deg,#000,#fff);border:1px solid var(--fg)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--bg);border:3px solid var(--fg);margin-top:-9px}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--bg);border:3px solid var(--fg)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.2/chess.min.js"></script>
</head>
<body>
<div class="wrap">
<header class="top"><span class="brand">Разбор</span><div class="tools"><span class="eng" id="eng">Движок: загрузка</span><button class="btn sm" id="openSet">Вид</button></div></header>

<p class="muted" id="engNote" hidden></p>
<section class="intro" id="load">
  <h1>Разбор партий</h1>
  <p class="lead">Вставьте PGN партии с chess.com: откройте партию, нажмите «Поделиться», вкладка PGN, «Копировать». Движок оценит каждый ход и отметит ошибки и находки.</p>
  <textarea id="pgn" placeholder="[Event &quot;Live Chess&quot;]&#10;[White &quot;...&quot;]&#10;&#10;1. e4 e5 2. Nf3 Nc6 ..." aria-label="PGN партии"></textarea>
  <div class="row"><span class="muted">Глубина анализа</span><div class="chips" id="depths"></div></div>
  <div class="row"><button class="btn fill" id="go">Анализировать</button><button class="btn" id="sample">Пример партии</button><label class="btn">Файл PGN<input type="file" id="file" accept=".pgn,.txt" hidden></label></div>
  <p class="err" id="err" role="alert"></p>
</section>

<section id="view" hidden>
  <div class="ghead"><div><b id="gt"></b><div class="muted" id="gm"></div></div><button class="btn sm" id="newg">Другая партия</button></div>
  <div class="stage">
    <div>
      <div class="pl"><span id="plT"></span><span class="muted num" id="plTa"></span></div>
      <div class="bwrap"><div class="evbar" id="evbar" aria-hidden="true"><i id="evf"></i></div><div class="board" id="board" data-ps="sil"></div></div>
      <div class="pl"><span id="plB"></span><span class="muted num" id="plBa"></span></div>
      <div class="ctl"><button class="btn" data-n="start" aria-label="В начало">«</button><button class="btn" data-n="prev" aria-label="Назад">‹</button><button class="btn" data-n="next" aria-label="Вперёд">›</button><button class="btn" data-n="end" aria-label="В конец">»</button><button class="btn play" id="play">Играть</button></div>
      <p class="hint">Стрелки на клавиатуре листают ходы, F переворачивает доску.</p>
    </div>
    <div>
      <div class="prog" id="prog" hidden><div class="bar"><u id="pb"></u></div><span class="muted num" id="pt"></span><button class="btn sm" id="stop">Стоп</button></div>
      <div class="say" id="say" aria-live="polite"></div>
      <svg id="graph" viewBox="0 0 600 100" preserveAspectRatio="none" role="img" aria-label="График оценки партии"></svg>
      <h2>Итоги</h2><div class="sum" id="sum"></div>
      <h2>Ходы</h2><div class="moves" id="moves"></div>
    </div>
  </div>
</section>
</div>

<div class="sheet" id="sheet" hidden><div class="sheet-in" role="dialog" aria-label="Оформление"><div class="sheet-top"><b>Вид</b><button class="btn sm" id="closeSet">Готово</button></div><div id="setBody"></div></div></div>

<script>
(function(){
var $=function(s,r){return(r||document).querySelector(s)};
var K="razbor-v2";
if(typeof Chess==="undefined"){$("#err").textContent="Не загрузилась библиотека шахмат. Проверьте интернет и обновите страницу."}

/* ---------- settings ---------- */
var BT={graphite:["Графит","#c4c4c4","#575757"],paper:["Бумага","#f3f3f3","#b3b3b3"],contrast:["Контраст","#ffffff","#1c1c1c"],fog:["Туман","#d9d9d9","#8d8d8d"]};
var PS={sil:"Силуэт",disk:"Диски",abc:"Буквы",tile:"Плитки"};
var BS={col:"Цветные",sym:"Знаки",lvl:"Градации"};
var P={board:"graphite",pieces:"sil",badge:"col",arrow:true,coords:true,depth:14,tone:null,flip:false};
try{var sv=JSON.parse(localStorage.getItem(K));if(sv)for(var q in sv)P[q]=sv[q]}catch(e){}
function savePrefs(){try{localStorage.setItem(K,JSON.stringify(P))}catch(e){}}
function setTone(v,s){v=Math.max(0,Math.min(255,Math.round(+v)));var fg=v>127?0:255,st=document.documentElement.style,mix=function(r){var c=Math.round(v+(fg-v)*r);return"rgb("+c+","+c+","+c+")"};
  st.setProperty("--bg","rgb("+v+","+v+","+v+")");st.setProperty("--fg","rgb("+fg+","+fg+","+fg+")");st.setProperty("--mid",mix(.72));st.setProperty("--line",mix(.2));st.setProperty("--soft",mix(.07));st.colorScheme=fg?"dark":"light";
  if(s){P.tone=v;savePrefs()}return v}
setTone(P.tone!==null?P.tone:(matchMedia("(prefers-color-scheme: dark)").matches?10:242),false);
function applyStyle(){var t=BT[P.board]||BT.graphite;document.documentElement.style.setProperty("--sl",t[1]);document.documentElement.style.setProperty("--sd",t[2]);document.body.dataset.bs=P.badge;var b=$("#board");if(b)b.dataset.ps=P.pieces}

/* ---------- classes ---------- */
var CL={brilliant:["Блестящий ход","!!",100],great:["Сильный ход","!",100],best:["Лучший ход","★",100],excellent:["Отличный ход","✓",80],good:["Хороший ход","○",60],inaccuracy:["Неточность","?!",40,1],mistake:["Ошибка","?",20,1],blunder:["Грубая ошибка","??",0,1,1],forced:["Вынужденный ход","=",50]};
var ORDER=["brilliant","great","best","excellent","good","inaccuracy","mistake","blunder"];
function bdg(c){var d=CL[c];return'<i class="bdg'+(d[3]?" bad":"")+(d[4]?" big":"")+'" data-c="'+c+'" style="--p:'+d[2]+'" title="'+d[0]+'">'+d[1]+"</i>"}

/* ---------- helpers ---------- */
var PV={p:100,n:320,b:330,r:500,q:900,k:0};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function cpOf(e){return e.mate!=null?(e.mate>0?10000-e.mate*10:-10000-e.mate*10):e.cp}
function wc(cp){return 1/(1+Math.exp(-0.00368208*Math.max(-3000,Math.min(3000,cp))))}
function whiteCp(i){var e=G.ev[i];if(!e)return null;var c=cpOf(e);return G.fens[i].split(" ")[1]==="w"?c:-c}
function fmtEv(i){var e=G.ev[i];if(!e)return"…";var w=G.fens[i].split(" ")[1]==="w";
  if(e.mate!=null){var m=w?e.mate:-e.mate;return m===0?(w?"0-1":"1-0"):(m>0?"+":"−")+"#"+Math.abs(m)}
  var v=(w?e.cp:-e.cp)/100;return(v>0?"+":v<0?"−":"")+Math.abs(v).toFixed(1)}
function toast(m){$("#err").textContent=m}

/* ---------- engines ---------- */
var E={mode:"js",w:null,name:"Встроенный движок"};
function setEng(t,ok){var e=$("#eng");e.textContent=t;e.classList.toggle("ok",!!ok);e.title=t}
var CAND=[["Stockfish 19 (lite)","stockfish-19-lite-single.js",1],["Stockfish 19 (lite)","https://unpkg.com/stockfish@19.0.1/bin/stockfish-19-lite-single.js"],["Stockfish 19 (lite)","https://cdn.jsdelivr.net/npm/stockfish@19.0.1/bin/stockfish-19-lite-single.js"],["Stockfish 18 (lite)","https://unpkg.com/stockfish@18.0.8/bin/stockfish-18-lite-single.js"]];
function tryOne(c){return new Promise(function(res,rej){
